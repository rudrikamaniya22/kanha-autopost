name: auto-post
on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      TAG: v${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python pipeline.py make
      - name: Host video temporarily
        run: gh release create "$TAG" out/video.mp4 --title "$TAG" --notes "temp"
      - name: Publish everywhere
        env:
          VIDEO_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/video.mp4
        run: python pipeline.py publish
      - name: Save state
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add state.json && git commit -m "advance topic" && git push || true
      - name: Cleanup release
        if: always()
        run: gh release delete "$TAG" --cleanup-tag -y || true
